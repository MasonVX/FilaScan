<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>FilaScan Wi-Fi Setup</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <h1>FilaScan</h1>
      <p class="subtitle">Wi-Fi setup and live diagnostics</p>

      <section class="log-section">
        <div class="log-heading">
          <h2>Device log</h2>
          <span id="log-status" class="connection-status">Connecting…</span>
        </div>
        <pre id="log-output" aria-live="polite">Waiting for diagnostic output…</pre>
      </section>

      <section>
        <label for="security-key">Setup key</label>
        <input id="security-key" type="password" autocomplete="current-password" placeholder="Shown on the FilaScan display">
        <button id="verify" type="button">Unlock</button>
        <p id="key-status" class="status"></p>
      </section>

      <section id="wifi" hidden>
        <label for="ssid">Wi-Fi network (SSID)</label>
        <input id="ssid" type="text" autocomplete="off">

        <label for="password">Wi-Fi password</label>
        <input id="password" type="password" autocomplete="new-password">

        <button id="save" type="button">Save and restart</button>
        <p id="save-status" class="status"></p>
      </section>
    </main>

    <script type="module">
      import init, { derive_key, encrypt, decrypt } from '/pkg/device_wasm.js';

      await init();

      const keyInput = document.querySelector('#security-key');
      const keyStatus = document.querySelector('#key-status');
      const wifiSection = document.querySelector('#wifi');
      const ssidInput = document.querySelector('#ssid');
      const passwordInput = document.querySelector('#password');
      const saveStatus = document.querySelector('#save-status');
      const logOutput = document.querySelector('#log-output');
      const logStatus = document.querySelector('#log-status');
      let encryptionKey;
      let lastLogText = '';

      async function refreshLogs() {
        try {
          const response = await fetch('/api/logs', { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const text = await response.text();
          const followTail = logOutput.scrollHeight - logOutput.scrollTop - logOutput.clientHeight < 36;
          if (text !== lastLogText) {
            logOutput.textContent = text || 'No diagnostic events recorded yet.';
            lastLogText = text;
            if (followTail) logOutput.scrollTop = logOutput.scrollHeight;
          }
          logStatus.textContent = 'Live';
          logStatus.classList.remove('offline');
        } catch (error) {
          logStatus.textContent = `Disconnected: ${error.message}`;
          logStatus.classList.add('offline');
        }
      }

      refreshLogs();
      setInterval(refreshLogs, 750);

      async function send(path, data) {
        const response = await fetch(path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/text' },
          body: encrypt(encryptionKey, JSON.stringify(data)),
        });
        if (!response.ok) throw new Error(`Request failed (${response.status})`);
        return response;
      }

      async function readWifi() {
        const response = await fetch('/api/wifi-config');
        if (!response.ok) throw new Error(`Request failed (${response.status})`);
        return JSON.parse(decrypt(encryptionKey, await response.text()));
      }

      document.querySelector('#verify').addEventListener('click', async () => {
        keyStatus.textContent = 'Checking key…';
        wifiSection.hidden = true;
        try {
          encryptionKey = derive_key(keyInput.value.trim(), 'example_salt');
          await send('/api/test-key', { test: 'FilaScan' });
          const wifi = await readWifi();
          ssidInput.value = wifi.ssid || '';
          passwordInput.value = wifi.password || '';
          keyStatus.textContent = 'Setup key accepted.';
          wifiSection.hidden = false;
        } catch (error) {
          keyStatus.textContent = `Could not unlock setup: ${error.message}`;
        }
      });

      document.querySelector('#save').addEventListener('click', async () => {
        saveStatus.textContent = 'Saving Wi-Fi settings…';
        try {
          const response = await send('/api/wifi-config', {
            ssid: ssidInput.value.trim(),
            password: passwordInput.value,
          });
          JSON.parse(decrypt(encryptionKey, await response.text()));
          saveStatus.textContent = 'Saved. FilaScan is restarting…';
          await send('/api/reset-device', {});
        } catch (error) {
          saveStatus.textContent = `Could not save Wi-Fi settings: ${error.message}`;
        }
      });

      const keyFromUrl = new URLSearchParams(location.hash.slice(1)).get('sk');
      if (keyFromUrl) {
        keyInput.value = keyFromUrl;
        document.querySelector('#verify').click();
      }
    </script>
  </body>
</html>
