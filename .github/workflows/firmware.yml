name: Build FilaScan firmware

on:
  push:
    branches: [main]
    tags: ['filascan-v*']
    paths:
      - core/**
      - shared/**
      - formats/**
      - scripts/build-firmware.sh
      - scripts/package-firmware.sh
      - .github/workflows/firmware.yml
  pull_request:
    branches: [main]
    paths:
      - core/**
      - shared/**
      - formats/**
      - scripts/build-firmware.sh
      - scripts/package-firmware.sh
      - .github/workflows/firmware.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ESP_TOOLCHAIN_NAME: esp190
  ESP_TOOLCHAIN_VERSION: 1.90.0.0
  ESPUP_VERSION: 0.17.1
  ESPFLASH_VERSION: 4.5.0

jobs:
  build:
    name: ESP32-S3 release image
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/filascan-v')
        working-directory: core
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "$GITHUB_REF_NAME" = "filascan-v$version"
          test -f "../.github/releases/$GITHUB_REF_NAME.md"

      - name: Restore ESP toolchain cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/esp190
            ~/export-esp190.sh
            ~/.cargo/bin/espup
            ~/.cargo/bin/espflash
          key: filascan-${{ runner.os }}-esp190-1.90.0.0-espup-0.17.1-espflash-4.5.0

      - name: Restore Cargo source cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: filascan-${{ runner.os }}-cargo-${{ hashFiles('core/Cargo.lock', 'shared/Cargo.lock', 'formats/Cargo.lock') }}
          restore-keys: |
            filascan-${{ runner.os }}-cargo-

      - name: Add Cargo tools to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Test tag format decoders
        run: cargo test --manifest-path formats/Cargo.toml --locked

      - name: Install ESP tools
        shell: bash
        run: |
          if ! espup --version 2>/dev/null | grep -Fq "$ESPUP_VERSION"; then
            cargo install espup --version "$ESPUP_VERSION" --locked
          fi
          if ! espflash --version 2>/dev/null | grep -Fq "$ESPFLASH_VERSION"; then
            cargo install espflash --version "$ESPFLASH_VERSION" --locked
          fi

      - name: Install ESP Rust toolchain
        shell: bash
        run: |
          export_file="$HOME/export-$ESP_TOOLCHAIN_NAME.sh"
          toolchain_dir="$HOME/.rustup/toolchains/$ESP_TOOLCHAIN_NAME"

          if [[ ! -d "$toolchain_dir" || ! -f "$export_file" ]]; then
            espup install \
              --name "$ESP_TOOLCHAIN_NAME" \
              --toolchain-version "$ESP_TOOLCHAIN_VERSION" \
              --targets esp32s3 \
              --export-file "$export_file"
          fi

          # shellcheck source=/dev/null
          source "$export_file"
          test -n "${LIBCLANG_PATH:-}"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"
          xtensa_bin="$(dirname "$(command -v xtensa-esp32s3-elf-gcc)")"
          printf '%s\n' "$xtensa_bin" >> "$GITHUB_PATH"
          rustup run "$ESP_TOOLCHAIN_NAME" rustc --version

      - name: Build and package release firmware
        run: ./scripts/build-firmware.sh dist

      - name: Prepare installer and OTA Pages artifact
        run: |
          python3 -m unittest discover -s scripts -p test_web_installer.py
          python3 scripts/prepare-web-installer.py dist dist/ota-pages

      - name: Upload firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FilaScan-esp32s3-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged firmware
    if: startsWith(github.ref, 'refs/tags/filascan-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download firmware artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: FilaScan-esp32s3-${{ github.sha }}
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#filascan-v}"
          gh release create "$GITHUB_REF_NAME" \
            dist/FilaScan-esp32s3.bin \
            "dist/FilaScan-$version-ota.bin" \
            dist/SHA256SUMS \
            dist/build-info.txt \
            dist/ota.toml \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "FilaScan $version" \
            --notes-file ".github/releases/$GITHUB_REF_NAME.md"

  pages:
    name: Publish installer and OTA channel
    concurrency:
      group: filascan-pages
      cancel-in-progress: false
    if: startsWith(github.ref, 'refs/tags/filascan-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Download firmware artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: FilaScan-esp32s3-${{ github.sha }}
          path: dist

      - name: Upload OTA channel
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/ota-pages

      - name: Deploy OTA channel
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
